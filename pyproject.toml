[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision_harness"
version = "0.1.0"
description = "OpenAI Decisions API-backed model selection and tool selection middleware for deepagents/LangChain harnesses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agent", "model-routing", "tool-selection", "decisions-api", "deepagents", "langchain"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
deepagents = ["deepagents>=0.7.22"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
