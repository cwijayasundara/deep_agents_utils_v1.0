name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # deepagents requires Python >=3.11: on 3.10 run the offline core suite
      # only (langchain-dependent tests auto-skip via importorskip).
      - run: >
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            pip install ".[dev]" && pip install -U . && pytest -q;
          else
            pip install ".[dev,deepagents]" && pip install -U . && pytest -q;
          fi
      - run: ruff check src tests examples
